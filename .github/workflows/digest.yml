name: Weekly AI Digest

on:
  schedule:
    - cron: '0 8 * * 1'      # every Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      debug:
        description: "Dump generated HTML to the Action log"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    env:
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      SMTP_EMAIL:      ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
      OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      GIT_PAT:         ${{ secrets.GIT_PAT }}

    steps:
      # -------------------------------------------------------
      # 0️⃣ Checkout with full history (required for push)
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # 1️⃣ Set up Python
      # -------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------------
      # 2️⃣ Install dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------
      # 3️⃣ Run the digest script
      # -------------------------------------------------------
      - name: Run digest
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug }}
        run: python digest.py

      # -------------------------------------------------------
      # 4️⃣ Commit updated sent_ids.json (push back to repo)
      # -------------------------------------------------------
      - name: Commit updated sent_ids.json
        if: always()
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

          if git diff --quiet sent_ids.json; then
            echo "sent_ids.json unchanged – nothing to commit."
            exit 0
          fi

          git add sent_ids.json
          git commit -m "Update sent_ids.json (auto-generated by AI-Digest)"
          git push
